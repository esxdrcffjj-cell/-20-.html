  side.append(pf,sf,h('button',{type:'button',class:'btn',text:'تسجيل الخروج',onclick:function(){admin=false;try{sessionStorage.removeItem('qa-admin')}catch(e){}render()}}));

  var q=h('textarea',{id:'nq',required:true,placeholder:'اكتب السؤال'});

  ['عبادات','أساسيات','معاملات','أسرة','أخلاق','متنوع'].forEach(function(x){dl.append(h('option',{value:x}))});
  var oi=[],orad=[];

var THEMES=[
  {id:'blue',label:'أزرق ملكي',frame:'#14306b',accent:'#b8892f',nm:'#1d4aa0',paper:'#fbfcff',text:'#14213d',muted:'#55627f'},
  {id:'green',label:'أخضر',frame:'#0b3b35',accent:'#b8892f',nm:'#0e5c52',paper:'#fbfdfc',text:'#12302d',muted:'#4f6b66'},
  {id:'maroon',label:'عنابي',frame:'#6d1f2c',accent:'#b8892f',nm:'#8a2a3a',paper:'#fffcfa',text:'#33141a',muted:'#7a5a60'},
  {id:'gold',label:'ذهبي',frame:'#5a4010',accent:'#c49a2c',nm:'#7a5612',paper:'#fffdf6',text:'#3a2a0c',muted:'#7a6a4a'}
];
function star(x,cx,cy,r,col){
  x.save();x.translate(cx,cy);x.strokeStyle=col;x.lineWidth=4;
  [0,Math.PI/4].forEach(function(a){x.save();x.rotate(a);x.strokeRect(-r,-r,2*r,2*r);x.restore()});
  x.restore();
}
function placeWord(r){var v=pct(r);return v===100?'المركز الأول':v>=90?'المركز الثاني':v>=80?'المركز الثالث':v>=70?'المركز الرابع':v>=60?'المركز الخامس':'المركز السادس'}
async function drawCert(cv,name,r,t){
  try{await Promise.all([
    document.fonts.load('700 96px "Reem Kufi"','شهادة تقدير'),
    document.fonts.load('600 80px "Noto Naskh Arabic"',name+(S.owner||'')+'المركز الأول'),
    document.fonts.load('400 44px "Noto Naskh Arabic"','تقديرا لاهتمامكم')
  ])}catch(e){}
  var W=1600,H=1130,x=cv.getContext('2d'),K='"Noto Naskh Arabic",Tahoma,serif';
  cv.width=W;cv.height=H;
  x.fillStyle=t.paper;x.fillRect(0,0,W,H);
  x.strokeStyle=t.frame;x.lineWidth=14;x.strokeRect(40,40,W-80,H-80);
  x.strokeStyle=t.accent;x.lineWidth=3;x.strokeRect(68,68,W-136,H-136);
  [[130,130],[W-130,130],[130,H-130],[W-130,H-130]].forEach(function(q){star(x,q[0],q[1],22,t.accent)});
  star(x,W/2,185,34,t.accent);
  x.direction='rtl';x.textAlign='center';x.textBaseline='alphabetic';
  x.fillStyle=t.frame;x.font='700 100px "Reem Kufi",Tahoma,sans-serif';
  x.fillText('شهادة تقدير',W/2,350);
  x.fillStyle=t.muted;x.font='400 44px '+K;
  x.fillText('تُمنح هذه الشهادة إلى',W/2,440);
  var size=100;
  do{x.font='600 '+size+'px '+K;size-=4}while(x.measureText(name).width>W-360&&size>28);
  x.fillStyle=t.nm;x.fillText(name,W/2,575);
  x.strokeStyle=t.accent;x.lineWidth=3;x.beginPath();x.moveTo(W/2-430,615);x.lineTo(W/2+430,615);x.stroke();
  x.fillStyle=t.text;x.font='400 40px '+K;
  x.fillText('تقديرًا لاهتمامكم بطلب العلم ومتابعتكم',W/2,705);
  x.fillText('الأسئلة والأجوبة في موقع «أسئلة دينية»',W/2,765);
  if(r){
    var pl=placeWord(r);
    if(pl){x.fillStyle=t.accent;x.font='700 66px "Reem Kufi",Tahoma,sans-serif';x.fillText('وقد حصل على '+pl,W/2,860)}
    x.fillStyle=t.nm;x.font='600 48px '+K;
    x.fillText('الدرجة: '+ar(r.ok)+' من '+ar(r.total)+' ('+ar(pct(r))+'٪) · '+gradeWord(r),W/2,pl?925:880);
  }
  x.strokeStyle=t.muted;x.lineWidth=2;
  [430,W-430].forEach(function(cx){x.beginPath();x.moveTo(cx-190,975);x.lineTo(cx+190,975);x.stroke()});
  x.fillStyle=t.text;x.font='600 40px '+K;
  x.fillText(S.owner||'',430,960);
  x.fillText(new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}),W-430,960);
  x.fillStyle=t.muted;x.font='400 34px '+K;
  x.fillText('صاحب الموقع',430,1025);
  x.fillText('التاريخ',W-430,1025);
}
function renderCert(){
  var box=$('#cert'),theme=THEMES[0],lastName='';
  var nm=h('input',{id:'cert-name',type:'text',maxlength:'60',autocomplete:'name',placeholder:'اكتب اسمك كما تريده على الشهادة'});
  var out=h('div',{class:'cert-out',hidden:true});
  var cv=h('canvas',{role:'img','aria-label':'شهادة تقدير'});
  var saveBtn=h('button',{type:'button',class:'btn',text:'حفظ الشهادة كصورة',hidden:true});
  out.append(cv,h('div',{class:'acts'},saveBtn));
  var lock=h('p',{class:'note'});
  var scoreLine=h('p',{class:'res right'});
  function paint(){var r=quiz();return drawCert(cv,lastName,r.total?r:null,theme)}
  var chips=h('div',{class:'chips',role:'group','aria-label':'لون الشهادة'});
  function renderSw(){
    chips.replaceChildren();
    THEMES.forEach(function(t){
      var dot=h('span',{class:'sw'});dot.style.background=t.frame;
      chips.append(h('button',{type:'button',class:'chip','aria-pressed':String(theme===t),onclick:function(){theme=t;renderSw();if(lastName&&!out.hidden)paint()}},dot,t.label));
    });
  }
  renderSw();
  var f=h('form',{class:'f',onsubmit:async function(ev){
    ev.preventDefault();
    var v=nm.value.trim().replace(/\s+/g,' ');
    if(v.length<2){toast('اكتب اسمك أولًا.');return}
    lastName=v;await paint();out.hidden=false;
  }},h('div',{class:'fld'},h('label',{for:'cert-name',text:'الاسم على الشهادة'}),nm),
     h('div',{class:'fld'},h('label',{text:'لون الشهادة'}),chips),
     h('button',{type:'submit',class:'btn solid',text:'إنشاء الشهادة'}));
  var ready=h('div',{class:'cert-form'},scoreLine,f);
  box.append(h('h2',{text:'شهادة التقدير'}),lock,ready,out);
  var wasLocked=null;
  refreshCert=function(){
    var r=quiz(),locked=r.total>0&&r.done<r.total;
    lock.hidden=!locked;ready.hidden=locked;scoreLine.hidden=!r.total;
    if(locked){out.hidden=true;lock.textContent='تظهر شهادتك بدرجتك بعد أن تجيب عن كل أسئلة الاختيارات. أجبت عن '+ar(r.done)+' من '+ar(r.total)+'.'}
    if(r.total&&!locked){var pl=placeWord(r);scoreLine.textContent='أنهيت الأسئلة. درجتك: '+ar(r.ok)+' من '+ar(r.total)+' ('+ar(pct(r))+'٪)'+(pl?' · '+pl:'')}
    if(wasLocked&&!locked)toast('أنهيت الأسئلة. اكتب اسمك لتحصل على شهادتك.');
    wasLocked=locked;
  };
  refreshCert();
  (async function(){
    var dl=null;try{dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null)}catch(e){}
    if(!dl)return;
    saveBtn.hidden=false;
    saveBtn.addEventListener('click',function(){
      cv.toBlob(function(b){
        if(!b){toast('تعذر تجهيز الصورة.');return}
        dl.save({filename:'certificate.png',data:b}).then(function(){toast('تم حفظ الشهادة.')},function(e){if(!e||e.code!=='declined')toast('تعذر حفظ الصورة. اضغط مطولًا على الشهادة لحفظها.')});
      },'image/png');
    });
  })();
}

$('#q-search').addEventListener('input',function(e){query=e.target.value;renderList()});
